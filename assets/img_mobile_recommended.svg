<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 694" font-family="Arial, Helvetica, sans-serif">
  <!-- screen background -->
  <rect width="320" height="694" fill="#ffffff"/>

  <!-- status bar -->
  <text x="20" y="23" font-size="15" font-weight="700" fill="#1d1d1d">9:41</text>
  <g fill="#1d1d1d">
    <rect x="250" y="12" width="16" height="10" rx="2"/>
    <path d="M272 22 a8 8 0 0 1 12 0" fill="none" stroke="#1d1d1d" stroke-width="2"/>
    <rect x="290" y="11" width="20" height="11" rx="3" fill="none" stroke="#1d1d1d" stroke-width="1.5"/>
    <rect x="292" y="13" width="14" height="7" rx="1.5"/>
  </g>

  <!-- app header -->
  <path d="M22 46 l-8 6 8 6" fill="none" stroke="#1d1d1d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="57" font-size="17" font-weight="800" fill="#1d1d1d" text-anchor="middle">Twój koszyk</text>
  <line x1="0" y1="74" x2="320" y2="74" stroke="#ececec" stroke-width="1"/>

  <!-- cart item -->
  <rect x="16" y="86" width="288" height="70" rx="12" fill="#ffffff" stroke="#e6e6e6" stroke-width="1"/>
  <rect x="26" y="96" width="50" height="50" rx="8" fill="#f2f2f2"/>
  <path d="M40 118 h22 M40 126 h22 M40 110 a11 11 0 0 1 22 0" fill="none" stroke="#c9c9c9" stroke-width="2" stroke-linecap="round"/>
  <text x="88" y="112" font-size="13" font-weight="700" fill="#1d1d1d">Kubek termiczny 350 ml</text>
  <text x="88" y="131" font-size="11" fill="#8a8a8a">1 szt. · czarny</text>
  <text x="294" y="122" font-size="14" font-weight="800" fill="#1d1d1d" text-anchor="end">59,00 zł</text>

  <!-- cross-sell heading -->
  <text x="16" y="188" font-size="11" font-weight="800" letter-spacing="0.8" fill="#8a8a8a">A MOŻE SPODOBA CI SIĘ?</text>

  <!-- cross-sell card 1 -->
  <rect x="16" y="202" width="288" height="92" rx="12" fill="#ffffff" stroke="#e6e6e6" stroke-width="1"/>
  <rect x="26" y="212" width="72" height="72" rx="10" fill="#f2f2f2"/>
  <path d="M46 268 h32 l-4 -22 h-24 z" fill="#dcdcdc"/>
  <circle cx="62" cy="238" r="10" fill="#e3e3e3"/>
  <text x="112" y="230" font-size="13" font-weight="700" fill="#1d1d1d">Torba bawełniana</text>
  <text x="112" y="248" font-size="11" fill="#8a8a8a">Kolor: beż</text>
  <text x="112" y="278" font-size="15" font-weight="800" fill="#1d1d1d">29,99 zł</text>
  <circle cx="278" cy="268" r="17" fill="#ffcc05"/>
  <path d="M278 260 v16 M270 268 h16" stroke="#1d1d1d" stroke-width="2.4" stroke-linecap="round"/>

  <!-- cross-sell card 2 -->
  <rect x="16" y="306" width="288" height="92" rx="12" fill="#ffffff" stroke="#e6e6e6" stroke-width="1"/>
  <rect x="26" y="316" width="72" height="72" rx="10" fill="#f2f2f2"/>
  <rect x="42" y="336" width="40" height="36" rx="4" fill="#dcdcdc"/>
  <rect x="54" y="330" width="16" height="10" rx="2" fill="#e3e3e3"/>
  <text x="112" y="334" font-size="13" font-weight="700" fill="#1d1d1d">Bidon sportowy</text>
  <text x="112" y="352" font-size="11" fill="#8a8a8a">700 ml</text>
  <text x="112" y="382" font-size="15" font-weight="800" fill="#1d1d1d">39,99 zł</text>
  <circle cx="278" cy="372" r="17" fill="#ffcc05"/>
  <path d="M278 364 v16 M270 372 h16" stroke="#1d1d1d" stroke-width="2.4" stroke-linecap="round"/>

  <!-- standard checkout (secondary) -->
  <rect x="16" y="470" width="288" height="46" rx="10" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.5"/>
  <text x="160" y="498" font-size="14" font-weight="700" fill="#5a5a5a" text-anchor="middle">Dodaj do koszyka</text>

  <!-- InPost Pay CTA -->
  <rect x="16" y="524" width="288" height="52" rx="12" fill="#ffcc05"/>
  <text x="120" y="556" font-size="14.5" font-weight="800" fill="#1d1d1d" text-anchor="middle">Dodaj do koszyka</text>
  <circle cx="214" cy="550" r="7" fill="#1d1d1d"/>
  <g stroke="#1d1d1d" stroke-width="1.6" stroke-linecap="round">
    <path d="M214 539 v-5 M214 566 v-5 M203 550 h-5 M230 550 h-5 M206.5 542.5 l-3.5 -3.5 M221.5 542.5 l3.5 -3.5 M206.5 557.5 l-3.5 3.5 M221.5 557.5 l3.5 3.5"/>
  </g>
  <text x="228" y="556" font-size="14.5" font-weight="800" fill="#1d1d1d">InPost</text>

  <!-- helper text -->
  <text x="160" y="600" font-size="11" fill="#8a8a8a" text-anchor="middle">Dostawa nawet 5 zł taniej z InPost!</text>

  <!-- bottom nav bar -->
  <rect x="0" y="636" width="320" height="58" fill="#1d1d1d"/>
  <g fill="#ffffff">
    <circle cx="40" cy="656" r="6"/><rect x="34" y="663" width="12" height="7" rx="3"/>
    <text x="40" y="684" font-size="8" text-anchor="middle" fill="#c9c9c9">Konto</text>
    <path d="M104 652 h14 l-2 12 h-10 z" fill="none" stroke="#ffffff" stroke-width="1.6"/><path d="M106 652 v-3 h10 v3" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <text x="111" y="684" font-size="8" text-anchor="middle" fill="#ffcc05">Koszyk</text>
    <circle cx="182" cy="655" r="6" fill="none" stroke="#ffffff" stroke-width="1.6"/><path d="M187 660 l4 4" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    <text x="184" y="684" font-size="8" text-anchor="middle" fill="#c9c9c9">Szukaj</text>
    <rect x="273" y="651" width="16" height="2.4" rx="1.2"/><rect x="273" y="657" width="16" height="2.4" rx="1.2"/><rect x="273" y="663" width="16" height="2.4" rx="1.2"/>
    <text x="281" y="684" font-size="8" text-anchor="middle" fill="#c9c9c9">Menu</text>
