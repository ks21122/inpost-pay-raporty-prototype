<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 694" font-family="Arial, Helvetica, sans-serif">
  <!-- screen background -->
  <rect width="320" height="694" fill="#ffffff"/>

  <!-- status bar -->
  <text x="20" y="23" font-size="15" font-weight="700" fill="#1d1d1d">9:41</text>
  <g fill="#1d1d1d">
    <rect x="250" y="12" width="16" height="10" rx="2"/>
    <path d="M272 22 a8 8 0 0 1 12 0" fill="none" stroke="#1d1d1d" stroke-width="2"/>
    <rect x="290" y="11" width="20" height="11" rx="3" fill="none" stroke="#1d1d1d" stroke-width="1.5"/>
    <rect x="292" y="13" width="14" height="7" rx="1.5"/>
  </g>

  <!-- app header -->
  <path d="M22 46 l-8 6 8 6" fill="none" stroke="#1d1d1d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="57" font-size="17" font-weight="800" fill="#1d1d1d" text-anchor="middle">Twój koszyk</text>
  <line x1="0" y1="74" x2="320" y2="74" stroke="#ececec" stroke-width="1"/>

  <!-- cart item -->
  <rect x="16" y="86" width="288" height="70" rx="12" fill="#ffffff" stroke="#e6e6e6" stroke-width="1"/>
  <rect x="26" y="96" width="50" height="50" rx="8" fill="#f2f2f2"/>
  <path d="M40 118 h22 M40 126 h22 M40 110 a11 11 0 0 1 22 0" fill="none" stroke="#c9c9c9" stroke-width="2" stroke-linecap="round"/>
  <text x="88" y="112" font-size="13" font-weight="700" fill="#1d1d1d">Plecak miejski 20L</text>
  <text x="88" y="131" font-size="11" fill="#8a8a8a">2 szt. · grafit</text>
  <text x="294" y="122" font-size="14" font-weight="800" fill="#1d1d1d" text-anchor="end">170,00 zł</text>

  <!-- coupon heading -->
  <text x="16" y="188" font-size="11" font-weight="800" letter-spacing="0.8" fill="#8a8a8a">TWÓJ KUPON</text>

  <!-- coupon banner (ticket) -->
  <rect x="16" y="200" width="288" height="96" rx="12" fill="#f1faf4" stroke="#1f9d57" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M16 212 a12 12 0 0 1 0 72 z" fill="#1f9d57"/>
  <text x="28" y="252" font-size="9" font-weight="800" fill="#ffffff" transform="rotate(-90 28 252)" text-anchor="middle" letter-spacing="1">KOD SKLEPU</text>
  <text x="56" y="228" font-size="13" font-weight="800" fill="#1d1d1d">20 zł taniej na koszyk</text>
  <text x="56" y="246" font-size="11.5" fill="#4a4a4a">przy zakupie od 150 zł</text>
  <text x="56" y="278" font-size="12" font-weight="800" fill="#1f9d57">Użyj kodu</text>
  <path d="M112 274 l7 0 M116 270 l4 4 -4 4" stroke="#1f9d57" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="236" y="258" width="56" height="26" rx="6" fill="#1f9d57"/>
  <text x="264" y="275" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">DODANY</text>

  <!-- summary -->
  <line x1="16" y1="330" x2="304" y2="330" stroke="#ececec" stroke-width="1"/>
  <text x="16" y="356" font-size="13" fill="#6a6a6a">Wartość koszyka</text>
  <text x="304" y="356" font-size="13" font-weight="700" fill="#1d1d1d" text-anchor="end">170,00 zł</text>
  <text x="16" y="384" font-size="13" fill="#1f9d57">Rabat z kuponu</text>
  <text x="304" y="384" font-size="13" font-weight="700" fill="#1f9d57" text-anchor="end">−20,00 zł</text>
  <text x="16" y="416" font-size="15" font-weight="800" fill="#1d1d1d">Do zapłaty</text>
  <text x="304" y="416" font-size="17" font-weight="800" fill="#1d1d1d" text-anchor="end">150,00 zł</text>
  <line x1="16" y1="434" x2="304" y2="434" stroke="#ececec" stroke-width="1"/>

  <!-- InPost Pay CTA -->
  <rect x="16" y="524" width="288" height="52" rx="12" fill="#ffcc05"/>
  <text x="120" y="556" font-size="14.5" font-weight="800" fill="#1d1d1d" text-anchor="middle">Zapłać z</text>
  <circle cx="196" cy="550" r="7" fill="#1d1d1d"/>
  <g stroke="#1d1d1d" stroke-width="1.6" stroke-linecap="round">
    <path d="M196 539 v-5 M196 566 v-5 M185 550 h-5 M212 550 h-5 M188.5 542.5 l-3.5 -3.5 M203.5 542.5 l3.5 -3.5 M188.5 557.5 l-3.5 3.5 M203.5 557.5 l3.5 3.5"/>
  </g>
  <text x="210" y="556" font-size="14.5" font-weight="800" fill="#1d1d1d">InPost</text>

  <!-- helper text -->
  <text x="160" y="600" font-size="11" fill="#8a8a8a" text-anchor="middle">Kupon naliczy się automatycznie</text>

  <!-- bottom nav bar -->
  <rect x="0" y="636" width="320" height="58" fill="#1d1d1d"/>
  <g fill="#ffffff">
    <circle cx="40" cy="656" r="6"/><rect x="34" y="663" width="12" height="7" rx="3"/>
    <text x="40" y="684" font-size="8" text-anchor="middle" fill="#c9c9c9">Konto</text>
    <path d="M104 652 h14 l-2 12 h-10 z" fill="none" stroke="#ffffff" stroke-width="1.6"/><path d="M106 652 v-3 h10 v3" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <text x="111" y="684" font-size="8" text-anchor="middle" fill="#ffcc05">Koszyk</text>
    <circle cx="182" cy="655" r="6" fill="none" stroke="#ffffff" stroke-width="1.6"/><path d="M187 660 l4 4" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    <text x="184" y="684" font-size="8" text-anchor="middle" fill="#c9c9c9">Szukaj</text>
    <rect x="273" y="651" width="16" height="2.4" rx="1.2"/><rect x="273" y="657" width="16" height="2.4" rx="1.2"/><rect x="273" y="663" width="16" height="2.4" rx="1.2"/>
    <text x="281" y="684" font-size="8" text-anchor="middle" fill="#c9c9c9">Menu</text>
  </g>
</svg>
